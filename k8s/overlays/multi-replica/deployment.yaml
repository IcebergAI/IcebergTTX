# Two replicas, and deploys that are no longer an outage.
#
# maxUnavailable: 0 keeps the old pod serving until the new one is ready, and
# maxSurge: 1 admits exactly one extra pod at a time. Readiness gates the
# cutover: the new pod reports ready only after it has migrated and loaded its
# config, so the rollout cannot advance onto a pod that is not serving yet.
#
# A facilitated exercise survives a deploy: clients on the terminating pod
# reconnect to the surviving one and refetch, which is the same recovery path
# they already use for a dropped network.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-ttx-app
  namespace: iceberg-ttx
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
