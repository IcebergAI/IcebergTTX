name: Release

# Publishes the container image to GHCR and creates a GitHub Release when a
# version tag is pushed (#73). SemVer tags: v1.2.3 (stable) or v1.2.3-beta.1
# (pre-release). workflow_dispatch is a build-only dry run by default.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only — skip push, signing, and the GitHub Release"
        type: boolean
        default: true

# Least privilege by default; the release job elevates what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/icebergai/iceberg-ttx
  # true for a tag push, or a workflow_dispatch with dry_run unchecked.
  SHOULD_PUSH: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}

jobs:
  # Branch protection covers pushes to main, not tag pushes — so without this job a
  # `v*` tag on any commit (a branch, a commit that never saw a PR, one whose CI
  # failed) would publish a signed, provenance-attested public image of untested
  # code, with the signing machinery lending it credibility (#267).
  verify:
    name: Verify the tagged commit is releasable
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read CI workflow-run conclusions for this commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: merge-base needs main's ancestry, not a shallow tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Assert the commit is on main
        if: env.SHOULD_PUSH == 'true'
        run: |
          # An annotated tag's GITHUB_SHA is the tag *object*, not the commit CI ran
          # against — peel it first, or the CI-run lookup below finds zero runs and
          # refuses a valid release. (merge-base peels implicitly; the API does not.)
          sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          echo "RELEASE_COMMIT=${sha}" >> "$GITHUB_ENV"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${sha} is not contained in origin/main — refusing to publish a release from an unmerged commit"
            exit 1
          fi
          echo "OK: ${sha} is on main"

      - name: Assert CI passed for this commit
        if: env.SHOULD_PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query the CI workflow's own runs for this SHA rather than the commit's
          # check-runs, which would also match this release workflow's jobs.
          latest="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_COMMIT}&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // "none"')"
          if [ "$latest" != "success" ]; then
            echo "::error::the most recent completed CI run for ${RELEASE_COMMIT} concluded '${latest}' — refusing to publish"
            exit 1
          fi
          echo "OK: CI succeeded for ${RELEASE_COMMIT}"

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
      id-token: write # cosign keyless signing + provenance OIDC
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag is authoritative for the release, but the image version is baked
      # from pyproject.toml (via importlib.metadata). Fail the release if they
      # disagree, so a tag can never ship an image labelled a different version.
      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -m pip install --quiet packaging
          python - <<'PY'
          import os, sys, tomllib
          from packaging.version import Version

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with open("pyproject.toml", "rb") as fh:
              proj = tomllib.load(fh)["project"]["version"]
          if Version(tag) != Version(proj):
              sys.exit(f"::error::tag {tag!r} != pyproject version {proj!r} — bump pyproject before tagging")
          print(f"OK: tag {tag} == pyproject version {proj}")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # metadata-action suppresses `latest` and the {{major}}.{{minor}} tag
          # for pre-releases (…-beta.N), so beta builds only publish the full
          # version + sha tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ env.SHOULD_PUSH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance (SLSA)
        if: env.SHOULD_PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: env.SHOULD_PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: env.SHOULD_PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Use the runner's gh CLI rather than a third-party release action
      # (fewer actions to trust; zizmor superfluous-actions). Pre-release when the
      # tag carries a SemVer pre-release suffix (contains "-").
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.SHOULD_PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # docker/metadata-action normalises a SemVer Git tag such as
          # v0.1.0-beta.1 to the published OCI tag 0.1.0-beta.1.
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          notes_file="$(mktemp)"
          {
            echo "Container image published to GHCR — SBOM + SLSA provenance attested, cosign-signed:"
            echo ""
            echo "    ${IMAGE}:${IMAGE_TAG}"
            echo ""
            echo "Pull, verify (cosign / attestation), and deploy instructions: docs/RELEASING.md."
          } > "$notes_file"
          args=(--title "$TAG" --generate-notes --notes-file "$notes_file")
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" "${args[@]}"
